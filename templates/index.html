<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Secure URL Shortener</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><main><header><p class="eyebrow">LOCAL PLATFORM DEMO</p><h1>Short links with clear boundaries.</h1><p>Create a redirect locally. Management data remains behind the authenticated API.</p></header>
<section aria-labelledby="create-heading"><h2 id="create-heading">Create a link</h2><form method="post" action="/ui/links"><label for="destination">Destination URL</label><input id="destination" name="destination" type="url" maxlength="2048" placeholder="https://example.com" required><label for="code">Custom code <span>(optional)</span></label><input id="code" name="code" pattern="[A-Za-z0-9_-]{6,32}" minlength="6" maxlength="32"><label for="token">Owner token</label><input id="token" name="token" type="password" autocomplete="off" required><button type="submit">Create short link</button></form></section>
<p class="note">The token is submitted in the request body only. This page intentionally does not expose link listings or administrative data.</p></main></body></html>
