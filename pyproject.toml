[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-url-shortener"
version = "0.1.0"
description = "A secure, local-first URL shortener platform"
requires-python = ">=3.13"
dependencies = ["alembic>=1.14,<2", "asyncpg>=0.30,<1", "fastapi>=0.115,<1", "httpx>=0.28,<1", "jinja2>=3.1,<4", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1", "sqlalchemy[asyncio]>=2.0.36,<3", "structlog>=24.4,<26", "uvicorn[standard]>=0.34,<1"]

[project.optional-dependencies]
dev = ["aiosqlite>=0.20,<1", "coverage>=7.10,<8", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904", "E501", "E702"]
